services:
  postgres:
    container_name: project_postgres
    image: postgres:17
    restart: always
    environment:
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    container_name: project_redis
    image: redis:7
    restart: always
    ports:
      - "6378:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
